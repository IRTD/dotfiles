#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1,preferred,0x0,1
monitor=DP-3,1920x1080@144,3840x350,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = imwheel -a 500 -b "45"
exec-once = ~/.cargo/bin/eww d
exec-once = ~/.cargo/bin/eww o wallpaper-mon1 
exec-once = ~/.cargo/bin/eww o wallpaper-mon0
exec-once = ~/.cargo/bin/eww o bar
exec-once = flatpak run com.github.wwmm.pulseeffects

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = alacritty
$fileManager = nautilus
$menu = wofi --show drun
$browser = firefox

# Some default env vars.
env = XCURSOR_SIZE,24
# env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
# env = LIBVA_DRIVER_NAME,nvidia
# env = XDG_SESSION_TYPE,wayland
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = WLR_NO_HARDWARE_CURSORS,1

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,de
    kb_variant = 
    kb_model =
    # kb_options = grp:alt_shift_toggle
    kb_options = 
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 1 # -1.0 - 1.0, 0 means no modification.
    force_no_accel = 1
    # scroll_points = 0.2 0.0 0.5 1 1.2 1.5
    scroll_factor = 1.25
    special_fallthrough = 1
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    # gaps_in = 8
    gaps_in = 0
    # gaps_out = 18
    gaps_out = 7
    border_size = 0
    col.active_border = rgba(6600ffff) rgba(006600ff) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = 1

    layout = dwindle
    # layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    # rounding = 18
    rounding = 0
    
    blur {
        enabled = true
        size = 2
        passes = 1
        xray = true
        brightness = 1.0
        contrast = 1.6
        noise = 0.2
        vibrancy = 1.0
    }

    drop_shadow = yes
    shadow_range = 14
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
    inactive_opacity = 0.97
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.08, 0.9, 0.5, 1.15
    bezier = fadeBezier, 0.05, 0.08, 0.1, 0.8
    bezier = linear, 0.5, 0.5, 0.5, 0.5

    animation = windows, 1, 4, myBezier
    animation = windowsIn, 1, 3, myBezier, popin 90%
    animation = windowsOut, 1, 6, myBezier, popin 95%
    animation = border, 1, 12, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, default, slidefadevert 30%
    animation = fadeSwitch, 1, 12, fadeBezier
    animation = fadeIn, 1, 2, fadeBezier
    animation = fadeOut, 1, 2, fadeBezier
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = false
    new_on_top = true
    drop_at_cursor = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = off
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    animate_mouse_windowdragging = 1
    hide_cursor_on_key_press = 1
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name=wacom-intuos-s-pen
    output=DP-1
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = float,class:(pulseeffects),title:(PulseEffects)
windowrulev2 = size 60% 80%,class:(pulseeffects),title:(PulseEffects)
windowrulev2 = float,class:(guitarix),title:(Guitarix: gx_head)
windowrulev2 = size 60% 80%,class:(guitarix),title:(Guitarix: gx_head)
windowrulev2 = suppressevent fullscreen,class:(krita),title:(Krita)
windowrulev2 = fullscreen,class:(th-u-64.exe),title:(Manage Licenses)
windowrulev2 = fullscreen,class:(th-u-64.exe),title:()

#workspace=1,m:DP-1,default:true,persistent:true
#workspace=2,m:DP-2,default:true,persistent:true
#workspace=3,m:DP-1,default:true,persistent:true
#workspace=4,m:DP-2,default:true,persistent:true
#workspace=5,m:DP-1,default:true,persistent:true
#workspace=6,m:DP-2,default:true,persistent:true
#workspace=7,m:DP-1,default:true,persistent:true
#workspace=8,m:DP-2,default:true,persistent:true
#workspace=9,m:DP-1,default:true,persistent:true
#workspace=0,m:DP-2,default:true,persistent:true

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = CTRL, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, B, exec, $browser
bind = $mainMod,D,execr,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = $mainMod,U,execr,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = $mainMod,F,fullscreen
bind = $mainMod,C,execr,~/dotfiles/.config/scripts/screenshot
bind = $mainMod,O,exec,flatpak run md.obsidian.Obsidian --disable-gpu
bind = $mainMod,Z,exec,playerctl previous
bind = $mainMod,X,exec,playerctl next
bind = $mainMod,A,exec,playerctl play-pause

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
