unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix
bind g split-window -h -c "#{pane_current_path}" \; send-keys clear Enter
bind v split-window -v -c "#{pane_current_path}"\; send-keys clear Enter
bind c new-window -c "#{pane_current_path}"\; send-keys clear Enter
bind r split-window -h -c "#{pane_current_path}" \; send-keys clear Enter "~/code/bash/auto_run_code.sh" Enter
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# set -g status-bg '#780e27'
set-option -g status-style bg=default
set -g pane-active-border-style fg='#780e27'
set -g pane-border-style fg='#3d2b2f'

set -g mouse on
